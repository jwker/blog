# 极简 md 博客：构建并发布到 GitHub Pages（gh-pages 分支）
# 触发方式：只有正文/脚本/配置变化才触发；传图（images/ 变化）不触发，等正文提交时一起上线
# 并发：新提交触发时自动取消正在跑的旧构建，只保留最新一次
name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'build.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'template.json'
      - 'templates/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-build
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 拉取完整 git 历史，构建时才能按每篇文章的真实提交时间排序

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
